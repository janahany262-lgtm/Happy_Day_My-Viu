<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20 Years of Viu ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
--gazal:#C9A86A; /* لون الغزال */
--berry:#5B8FB9; /* ازرق توت */
--cream:#FFF8F0;
}
body{margin:0; background: linear-gradient(135deg, #F5E6C8 0%, #D6E6F5 50%, #B8D4E8 100%); min-height:100vh; font-family:'Caveat',cursive; text-align:center; padding:30px 15px}
.header-20{font-family:'Playfair Display'; font-size:80px; color:var(--gazal); margin:0; text-shadow:2px 2px 0 #fff}
.cake{font-size:60px; margin:10px 0}
h1{font-family:'Playfair Display'; color:#4A3B2A; font-size:36px; margin:5px 0}
.sub{color:#6B7B8F; font-size:20px; margin-bottom:25px}
.grid{max-width:380px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:12px}
.card{background:rgba(255,255,255,0.9); border:2px solid var(--gazal); border-radius:20px; padding:18px 10px; cursor:pointer; font-size:22px; color:#4A3B2A; transition:0.3s; backdrop-filter:blur(5px)}
.card:nth-child(even){border-color:var(--berry)}
.card:hover{transform:translateY(-4px); box-shadow:0 8px 20px rgba(0,0,0,0.15)}
.card span{font-size:12px; display:block; color:#8a8a8a; margin-top:4px}
.letter{display:none; background:var(--cream); padding:25px; border-radius:25px; max-width:400px; margin:20px auto; box-shadow:0 15px 40px rgba(0,0,0,0.15); text-align:left; border:3px solid var(--gazal)}
.letter img{width:100%; border-radius:15px; margin:15px 0}
.letter audio, .letter video{width:100%; margin:12px 0; border-radius:12px}
.back{background:linear-gradient(to right, var(--gazal), var(--berry)); color:white; border:none; padding:10px 25px; border-radius:20px; cursor:pointer; font-family:'Caveat'; font-size:18px}
.tag{display:inline-block; background:var(--berry); color:white; padding:4px 12px; border-radius:20px; font-size:14px; margin-bottom:10px}
</style>
</head>
<body>

<div class="cake">🎂</div>
<div class="header-20">20</div>
<h1>Happy Birthday Viu ♡</h1>
<p class="sub">7 surprises from jino to my favorite art</p>

<div class="grid" id="grid">
<div class="card" onclick="openL('l1')">jino <span>letter #1 ♡</span></div>
<div class="card" onclick="openL('l2')">jino <span>letter #2 ♡</span></div>
<div class="card" onclick="openL('l3')">jino <span>letter #3 ♡</span></div>
<div class="card" onclick="openL('l4')">jino <span>letter #4 ♡</span></div>
<div class="card" onclick="openL('l5')">jino <span>letter #5 ♡</span></div>
<div class="card" onclick="openL('l6')">jino <span>letter #6 ♡</span></div>
<div class="card" onclick="openL('l7')">jino <span>letter #7 - finale</span></div>
</div>

<!-- غيري اللي جوا كل letter -->
<div id="l1" class="letter">
<span class="tag">Verse 1 / المقطع الأول</span>
<p>Viu, the morning is quiet, / فيو، الصباحُ ساكن...<br>
